name: Publish SMM packages

on:
  workflow_dispatch:
    inputs:
      index:
        description: Target Python package index
        required: true
        type: choice
        options:
          - testpypi
          - pypi
      package:
        description: Package to publish
        required: true
        type: choice
        options:
          - both
          - smm-local
          - smm-hub

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.8"
      - run: python3 scripts/build_packages.py
      - uses: actions/upload-artifact@v4
        with:
          name: smm-local
          path: dist/packages/smm_local-*.whl
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: smm-hub
          path: dist/packages/smm_hub-*.whl
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(inputs.package == 'both' && '["smm-local","smm-hub"]' || format('["{0}"]', inputs.package)) }}
    environment: ${{ matrix.package == 'smm-hub' && format('{0}-hub', inputs.index) || inputs.index }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: dist
      - if: inputs.index == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
      - if: inputs.index == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
