name: Document formats actual SCM four-format Web capability
on:
  push:
    branches: [codex/008-document-formats-impl]
    paths: [.github/workflows/document-formats-scm-formats.yml]
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
  UV_LINK_MODE: copy
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.acceptance-local/scm-formats-browsers
jobs:
  scm-formats:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {version: '0.13.8', python-version: '3.14'}
      - name: Install frozen controller dependencies
        run: |
          mkdir -p .acceptance-local/scm-formats-logs
          uv sync --frozen --extra test --extra documents --extra acceptance > .acceptance-local/scm-formats-logs/sync.stdout 2> .acceptance-local/scm-formats-logs/sync.stderr
      - name: Prepare actual task materials and installed products
        run: |
          uv run --frozen --no-sync python scripts/acceptance/document_formats_prepare.py prepare --work .acceptance-local/scm-formats-materials --output .acceptance-local/scm-formats-materials.json > .acceptance-local/scm-formats-logs/materials.stdout 2> .acceptance-local/scm-formats-logs/materials.stderr
          uv run --frozen --no-sync python scripts/acceptance/document_formats_installed_prepare.py --work .acceptance-local/scm-formats-products --materials .acceptance-local/scm-formats-materials.json > .acceptance-local/scm-formats-logs/products.stdout 2> .acceptance-local/scm-formats-logs/products.stderr
      - name: Prepare actual standard-client browser
        run: uv run --frozen --no-sync playwright install chromium > .acceptance-local/scm-formats-logs/browser.stdout 2> .acceptance-local/scm-formats-logs/browser.stderr
      - name: Exercise stock SCM four-format Web processing with actual standard client
        run: uv run --frozen --no-sync python -I -X utf8 scripts/acceptance/document_formats_scm_formats.py --target-config .acceptance-local/scm-formats-products/target.json --output .acceptance-local/scm-formats-business > .acceptance-local/scm-formats-logs/business.stdout 2> .acceptance-local/scm-formats-logs/business.stderr
      - name: Preserve actual service and actor originals
        if: always()
        run: |
          mkdir -p .acceptance-local/scm-formats-products/business .acceptance-local/scm-formats-products/outer-logs
          if [ -d .acceptance-local/scm-formats-business ]; then cp -R .acceptance-local/scm-formats-business/. .acceptance-local/scm-formats-products/business/; fi
          cp .acceptance-local/scm-formats-logs/* .acceptance-local/scm-formats-products/outer-logs/
          uv run --no-project --python 3.14 python scripts/acceptance/document_formats_cross_os_collect.py --work .acceptance-local/scm-formats-products --materials .acceptance-local/scm-formats-materials.json --output .acceptance-local/scm-formats-evidence --context .acceptance-local/scm-formats-context.json --job-key scm-formats-win32
      - name: Encrypt component originals
        if: always()
        run: uv run --no-project --python 3.14 --with cryptography==50.0.2 python scripts/acceptance/document_formats_evidence.py pack --source .acceptance-local/scm-formats-evidence --public-key changes/008-document-format-support/evidence/ci-completion-public-key.pem --context .acceptance-local/scm-formats-context.json --output .acceptance-local/scm-formats.smm-evidence --receipt .acceptance-local/scm-formats-generated.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 008-scm-formats-win32-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: error
          include-hidden-files: true
          path: .acceptance-local/scm-formats.smm-evidence
