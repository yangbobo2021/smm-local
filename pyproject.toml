[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smm-local"
version = "0.1.0"
description = "Local, durable conversation archive and search for coding agents"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "mcp>=1.12,<2"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
smm = "smm_local.cli:main"
smm-mcp = "smm_local.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
smm_local = ["static/*"]
