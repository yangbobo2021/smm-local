[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smm-local"
version = "0.2.0rc15"
description = "Local, durable conversation archive and search for coding agents"
requires-python = ">=3.11"
dependencies = ["fastapi==0.162.0", "uvicorn==0.54.0", "mcp==1.30.0", "zstandard>=0.23; python_version < '3.14'"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
smm = "smm_local.cli:main"
smm-mcp = "smm_local.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
smm_local = ["static/*"]
