[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "smm-local"
version = "0.4.0"
description = "Local, durable conversation archive and search for coding agents"
readme = {text = """# SMM Local

Import, index and search Codex and Claude Code conversation archives on one computer. Install the smm-search Skill to set up this package and use it from your agent.
""", content-type = "text/markdown"}
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["fastapi==0.162.0", "uvicorn==0.54.0", "mcp==1.30.0", "zstandard>=0.23; python_version < '3.14'"]

[project.optional-dependencies]
documents = ["defusedxml==0.7.1", "pdfplumber==0.11.11", "pdfminer.six==20260107", "pypdfium2==5.15.2", "Pillow==13.0.0", "psutil==7.2.2", "cffi==2.1.1", "charset-normalizer==3.5.3", "cryptography==50.0.2", "pycparser==3.12"]
test = ["pytest>=8", "httpx>=0.27", "reportlab==5.1.0"]
acceptance = ["playwright>=1.51"]

[project.scripts]
smm = "smm_local.cli:main"
smm-mcp = "smm_local.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["smm_local*"]

[tool.setuptools.package-data]
smm_local = ["static/*"]
